name: conformance
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  ethereum-state-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - uses: actions/cache@v4
      with:
        path: tests/ethereum/.cache
        key: eth-fixtures-${{ hashFiles('tests/ethereum/fixtures.lock') }}
    - run: make test_ethereum
    - if: always()
      run: echo "commit ${{ github.sha }}" >> ethtest-results.txt
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ethtest-results
        path: ethtest-results.txt
        if-no-files-found: warn
